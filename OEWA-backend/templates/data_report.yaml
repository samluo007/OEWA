nodes:
  - id: node_1
    type: http
    position:
      x: 100
      y: 100
    data:
      label: 获取数据
      config:
        url: https://api.example.com/data
        method: GET
  - id: node_2
    type: code
    position:
      x: 300
      y: 100
    data:
      label: 数据清洗
      config:
        code: "cleaned_data = clean(raw_data)"
  - id: node_3
    type: llm
    position:
      x: 500
      y: 100
    data:
      label: 生成报告
      config:
        model: gpt-4o
        prompt: 根据数据生成报告摘要：{cleaned_data}
  - id: node_4
    type: http
    position:
      x: 700
      y: 100
    data:
      label: 发送报告
      config:
        url: https://api.example.com/send-report
        method: POST
edges:
  - id: edge_1
    source: node_1
    target: node_2
  - id: edge_2
    source: node_2
    target: node_3
  - id: edge_3
    source: node_3
    target: node_4
