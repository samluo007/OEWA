nodes:
  - id: node_1
    type: http
    position:
      x: 100
      y: 100
    data:
      label: 获取用户行为
      config:
        url: https://api.example.com/user-behavior
        method: GET
  - id: node_2
    type: llm
    position:
      x: 300
      y: 100
    data:
      label: 用户分群
      config:
        model: gpt-4o
        prompt: 根据用户行为数据分群：{behavior_data}
  - id: node_3
    type: condition
    position:
      x: 500
      y: 100
    data:
      label: 高价值用户？
      config:
        condition: "segment == 'high_value'"
  - id: node_4
    type: llm
    position:
      x: 700
      y: 50
    data:
      label: 生成营销文案
      config:
        model: gpt-4o
        prompt: 为高价值用户生成个性化营销文案
  - id: node_5
    type: http
    position:
      x: 700
      y: 150
    data:
      label: 发送邮件
      config:
        url: https://api.example.com/send-email
        method: POST
  - id: node_6
    type: code
    position:
      x: 900
      y: 100
    data:
      label: 记录营销活动
      config:
        code: "log_activity(campaign_data)"
  - id: node_7
    type: llm
    position:
      x: 1100
      y: 100
    data:
      label: 效果预测
      config:
        model: gpt-4o
        prompt: 预测本次营销活动效果
  - id: node_8
    type: http
    position:
      x: 1300
      y: 100
    data:
      label: 同步到CRM
      config:
        url: https://api.example.com/crm-sync
        method: POST
edges:
  - id: edge_1
    source: node_1
    target: node_2
  - id: edge_2
    source: node_2
    target: node_3
  - id: edge_3
    source: node_3
    target: node_4
    condition: true
  - id: edge_4
    source: node_3
    target: node_5
    condition: false
  - id: edge_5
    source: node_4
    target: node_6
  - id: edge_6
    source: node_5
    target: node_6
  - id: edge_7
    source: node_6
    target: node_7
  - id: edge_8
    source: node_7
    target: node_8
