nodes:
  - id: node_1
    type: llm
    position:
      x: 100
      y: 200
    data:
      label: 解析JD要点
      config:
        model: gpt-4o
        prompt: "从以下职位描述中提取关键要求：\n1. 必备技能\n2. 经验年限\n3. 学历要求\n4. 薪资范围\n5. 核心挑战\n\nJD内容：{jd_text}\n\n以结构化JSON格式输出。"
  - id: node_2
    type: code
    position:
      x: 300
      y: 200
    data:
      label: 匹配候选人库
      config:
        code: "def match_candidates(jd_requirements, candidate_pool):\n    scores = []\n    for c in candidate_pool:\n        score = 0\n        if jd_requirements.get('skills') in c.get('skills', []):\n            score += 40\n        if jd_requirements.get('experience') <= c.get('experience', 0):\n            score += 30\n        if jd_requirements.get('education') <= c.get('education', 0):\n            score += 20\n        scores.append({**c, 'match_score': score})\n    return sorted(scores, key=lambda x: x['match_score'], reverse=True)[:10]\n"
  - id: node_3
    type: condition
    position:
      x: 500
      y: 200
    data:
      label: 匹配率 > 70%？
      config:
        condition: "match_score > 70"
  - id: node_4
    type: llm
    position:
      x: 700
      y: 120
    data:
      label: 生成候选人报告
      config:
        model: gpt-4o
        prompt: "为候选人 {candidate_name} 生成推荐报告，突出：\n1. 与JD的匹配点\n2. 潜在风险\n3. 面试建议问题\n4. 薪资谈判建议"
  - id: node_5
    type: llm
    position:
      x: 700
      y: 280
    data:
      label: 生成婉拒理由
      config:
        model: gpt-4o
        prompt: "根据JD要求 {jd_requirements}，为不匹配的候选人生成专业婉拒邮件草稿"
  - id: node_6
    type: llm
    position:
      x: 900
      y: 200
    data:
      label: 生成面试安排
      config:
        model: gpt-4o
        prompt: "生成面试安排邮件，包含：\n1. 面试时间建议（候选人和HR时间匹配）\n2. 面试官推荐\n3. 面试流程说明\n4. 候选人需要准备的内容"
  - id: node_7
    type: http
    position:
      x: 1100
      y: 200
    data:
      label: 同步到ATS系统
      config:
        url: https://api.example.com/ats/candidates
        method: POST
edges:
  - id: edge_1
    source: node_1
    target: node_2
  - id: edge_2
    source: node_2
    target: node_3
  - id: edge_3
    source: node_3
    target: node_4
    condition: true
  - id: edge_4
    source: node_3
    target: node_5
    condition: false
  - id: edge_5
    source: node_4
    target: node_6
  - id: edge_6
    source: node_5
    target: node_7
  - id: edge_7
    source: node_6
    target: node_7
